name: chenda_melam_app
description: A scheduling application for Chenda Melam artists
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  local_auth: ^2.1.5
  flutter_secure_storage: ^8.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vercel-flutter-plugin: ^0.1.0 # Add this line

flutter:
  uses-material-design: true
  assets:
    - assets/images/ecstacy-of-thrissur-pooram-PT2T39.jpg
